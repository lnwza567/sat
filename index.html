<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Tracker | ระบบติดตามงานค้าง</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main role="main" class="container">
        <header>
            <h1>📋 Smart Task Tracker</h1>
            <h2 id="subtitle">ระบบติดตามงานค้างอัจฉริยะ</h2>
        </header>

        <section class="form-card">
            <div class="form-group">
                <label for="subject">วิชา:</label>
                <input type="text" id="subject" placeholder="เช่น วิทยาการคำนวณ..." autocomplete="off">
            </div>
            <div class="form-group">
                <label for="title">ชื่องาน:</label>
                <input type="text" id="title" placeholder="เช่น โปรเจกต์ OOP..." autocomplete="off">
            </div>
            <div class="form-group">
                <label for="deadline">กำหนดส่ง:</label>
                <input type="date" id="deadline">
            </div>
            <button id="add-btn" class="btn-primary">เพิ่มรายการงาน</button>
        </section>

        <section id="task-list" class="grid-container">
            <!-- รายการงานจะแสดงผ่าน JavaScript -->
        </section>
    </main>

    <!-- Material Design Modal -->
    <div
        id="edit-modal"
        class="material-modal"
        aria-hidden="true"
    >
        <div class="material-modal__backdrop" data-modal-close></div>

        <section
            class="material-modal__surface"
            role="dialog"
            aria-modal="true"
            aria-labelledby="edit-modal-title"
        >
            <header class="material-modal__header">
                <div class="material-modal__title-group">
                    <span class="material-modal__icon" aria-hidden="true">✏️</span>
                    <div>
                        <h2 id="edit-modal-title">แก้ไขรายการงาน</h2>
                        <p>ปรับปรุงข้อมูลแล้วกดบันทึก</p>
                    </div>
                </div>

                <button
                    type="button"
                    id="close-edit-btn"
                    class="material-modal__close"
                    aria-label="ปิดหน้าต่างแก้ไข"
                >
                    ×
                </button>
            </header>

            <form id="edit-form" class="material-modal__form">
                <div class="material-field">
                    <label for="edit-subject">วิชา</label>
                    <input
                        type="text"
                        id="edit-subject"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="material-field">
                    <label for="edit-title">ชื่องาน</label>
                    <input
                        type="text"
                        id="edit-title"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="material-field">
                    <label for="edit-deadline">กำหนดส่ง</label>
                    <input
                        type="date"
                        id="edit-deadline"
                        required
                    >
                </div>

                <footer class="material-modal__actions">
                    <button
                        type="button"
                        id="cancel-edit-btn"
                        class="material-button material-button--text"
                    >
                        ยกเลิก
                    </button>

                    <button
                        type="submit"
                        id="confirm-edit-btn"
                        class="material-button material-button--filled"
                    >
                        บันทึก
                    </button>
                </footer>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
